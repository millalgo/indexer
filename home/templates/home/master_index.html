<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Master Index</title>
  <style>
      :root {
        --table-font-size: 0.9rem; /* Adjust this value as needed */
      }

      /* Table styling */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 2em;
        font-size: var(--table-font-size);
      }

      table th,
      table td {
        border: 1px solid #ccc;
        padding: 0.5em;
        text-align: left;
      }

      table th {
        background: #f0f0f0;
      }

      /* General form styling */
      form {
        margin-bottom: 2em;
      }

      label {
        display: block;
        margin-bottom: 0.3em;
        font-weight: bold;
      }

      select {
        width: 100%;
        max-width: 400px;
      }

      /* Inline form for delete & export buttons */
      .action-form {
        display: inline;
        margin: 0;
        padding: 0;
      }

      .action-form button {
        background: none;
        border: none;
        color: #007BFF;
        text-decoration: underline;
        cursor: pointer;
        font: inherit;
        padding: 0;
        margin-right: 0.5em;
      }

      /* Link styling */
      .action-link {
        margin-right: 0.5em;
      }

      /* Home link styling */
      .home-link {
        margin-bottom: 1em;
        display: inline-block;
        font-weight: bold;
        text-decoration: none;
        color: #007BFF;
      }

      /* Symbol link & description textarea */
      .symbol-link {
        display: inline-block; /* Keeps link inline but allows margin */
        margin-bottom: 0.5em;
      }

      /* Larger description area */
      #id_description {
        width: 75%;
        min-height: 200px; /* Enlarged height */
        resize: vertical; /* Allow user to resize vertically */
      }

      /* Wider terms input */
      #id_terms {
        width: 25%;
      }
  </style>

  <!-- MathJax: treat $$ … $$ as inline, keep \[ \] for display -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$$', '$$'], ['\\(', '\\)']],
        displayMath: [['\\[', '\\]']]
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>
<body>
    <!-- Home link -->
    <p>
    <a href="http://127.0.0.1" class="home-link">&larr; Home</a>
    </p>

    {% if entries %}
        <table>
        <thead>
        <tr>
            <th>Book</th>
            <th>Page</th>
            <th>Term</th>
            <th>Description</th>
        </tr>
        </thead>
        <tbody>
        {% for entry in entries %}
        <tr>
            <td>{{ entry.book.title }}</td>
            <td>{{ entry.page }}</td>
            <td>{{ entry.term }}</td>
            <td>{{ entry.description|linebreaksbr|safe }}</td>
        </tr>
        {% endfor %}
        </tbody>
        </table>
    {% else %}
        <p>No entries found.</p>
    {% endif %}

</body>
</html>
